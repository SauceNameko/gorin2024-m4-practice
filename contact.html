<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="./contact.css">
</head>

<body>
    <header>
        <h1>Iconic&Reach</h1>
        <nav>
            <a href="./index.html">トップ</a>
            <a href="./example.html">事例紹介</a>
            <a href="./contact.html">お問い合わせ</a>
        </nav>
        <div class="ham">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvas" aria-labelledby="offcanvasLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasLabel">メニュー</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div>
                    <a href="./index.html">トップ</a>
                    <a href="./example.html">事例紹介</a>
                    <a href="./contact.html">お問い合わせ</a>
                </div>
            </div>
        </div>
    </header>

    <section class="sec-1 container">
        <h1 class="sec-1-title text-center">お問い合わせフォーム</h1>
        <form>
            <div class="mb-4">
                <label for="text" class="form-label">法人名<span>必須入力</span></label>
                <input type="text" class="form-control" id="text" aria-describedby="text">
            </div>

            <div class="mb-4">
                <label for="text" class="form-label">フリガナ<span>必須入力</span></label>
                <input type="text" class="form-control" id="text" aria-describedby="text">
            </div>

            <div class="mb-4">
                <label for="text" class="form-label">電話番号<span>必須入力</span></label>
                <input type="text" class="form-control" id="text" aria-describedby="text">
            </div>

            <div class="mb-4">
                <label for="exampleInputEmail1" class="form-label">メールアドレス<span>必須入力</span></label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
            </div>
            <div class="mb-4">

                <label for="exampleInputEmail1" class="form-label">お問い合わせ種別<span>必須入力</span></label>
                <select class="form-select" aria-label="Default select example">
                    <option selected>選択してください</option>
                    <option value="1">お見積もり希望</option>
                    <option value="2">概要説明、デモ希望</option>
                    <option value="3">資料請求</option>
                    <option value="4">機材に関するお問い合わせ</option>
                    <option value="5">コンテンツ制作の相談</option>
                </select>
            </div>


            <div class="mb-4">
                <label for="exampleFormControlTextarea1" class="form-label">お問い合わせ内容<span>任意入力</span></label>
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
            </div>

            <button type="submit" class="form-btn">送信</button>
        </form>
    </section>

    <footer>
        <div>© 2024 Iconic & Reach Inc.</div>
    </footer>
    <script src="./contact.js"></script>
</body>

</html>
